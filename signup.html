<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/button.css">
    <style>
        .card {width:50%; margin:5px auto;}
        .input {width:100%;}
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a class="brand" href="./index.html">📚 Library</a>
            </nav>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h2>회원가입</h2>
            <form action="" method="">
                <div class="form_group">
                    <input class="input" type="text" placeholder="이름" required>
                    <input class="input" type="text" placeholder="아이디" required>
                    <input class="input" type="password" placeholder="비밀번호" required>
                    <input class="input" type="email" placeholder="이메일" required>
                    <a class="btn special" href="./login.html">가입하기(데모)</a>                    
                </div>
            </form>
        </section>
    </main>
</body>
</html>
